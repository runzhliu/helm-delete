name: "cm-delete"
version: "0.0.4"
usage: "Delete chart from ChartMuseum"
description: "Delete a specific version of a chart from a ChartMuseum repository"
platformCommand:
  - command: ${HELM_PLUGIN_DIR}/bin/helm-cm-delete
  - os: windows
    command: ${HELM_PLUGIN_DIR}\bin\helm-cm-delete.exe
platformHooks:
  install:
    - command: sh
      args:
        - ${HELM_PLUGIN_DIR}/scripts/install_plugin.sh
  update:
    - command: sh
      args:
        - ${HELM_PLUGIN_DIR}/scripts/install_plugin.sh
